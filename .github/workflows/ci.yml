name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]  # 3.14 与本地开发环境一致
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 最小测试依赖：torch/funasr/sherpa-onnx 均为惰性导入，
      # 单测用伪引擎/纯函数，无需模型与重型推理框架
      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio jsonschema httpx "protobuf>=4.25"

      - name: 运行单元测试
        run: python -m pytest tests/ -q

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
          retention-days: 3
